[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "srikar5960", email = "vijaysrikarpentapati@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "accelerate>=1.14.0",
    "chromadb>=1.5.9",
    "faiss-cpu>=1.15.0",
    "flask>=3.1.3",
    "flask-cors>=6.0.5",
    "ipykernel>=7.3.0",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-core>=1.5.3",
    "langchain-groq>=1.1.3",
    "langchain-text-splitters>=1.1.2",
    "matplotlib>=3.11.1",
    "notebook>=7.6.1",
    "pillow>=12.3.0",
    "pymupdf>=1.28.0",
    "pypdf>=6.14.2",
    "python-dotenv>=1.2.2",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.1",
    "sentencepiece>=0.2.2",
    "timm>=1.0.28",
    "torch>=2.13.0",
    "torchvision>=0.28.0",
    "transformers>=5.9.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
